<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Optical Store Management</title>
<style>
:root{
  --navy:#0B2545; --navy2:#13315C; --teal:#0D9488; --teal2:#14B8A6;
  --bg:#F1F5F9; --card:#fff; --border:#E2E8F0; --text:#1E293B;
  --muted:#64748B; --success:#10B981; --danger:#EF4444; --warn:#F59E0B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--navy);color:#fff;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50;transition:transform .2s}
.brand{padding:20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-logo{width:36px;height:36px;border-radius:8px;object-fit:cover;background:#fff}
.brand-initials{width:36px;height:36px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.brand-name{font-weight:600;font-size:15px;line-height:1.2}
.brand-sub{font-size:11px;opacity:.6}
.nav{flex:1;overflow-y:auto;padding:12px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;color:rgba(255,255,255,.75);text-decoration:none;font-size:14px;margin-bottom:2px;cursor:pointer}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--teal);color:#fff}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.credit{padding:14px;text-align:center;font-size:11px;opacity:.5;border-top:1px solid rgba(255,255,255,.08)}

.main{flex:1;margin-left:240px;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:30}
.hamburger{display:none;background:none;border:none;font-size:22px;color:var(--navy)}
.page-title{font-size:18px;font-weight:600;color:var(--navy)}
.quick-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.content{padding:24px;flex:1;min-width:0}
.demo-banner{background:#FEF3C7;color:#92400E;padding:8px 16px;font-size:12px;text-align:center;border-bottom:1px solid #FDE68A}

/* Buttons */
.btn{padding:8px 14px;border-radius:8px;border:none;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn-primary{background:var(--teal);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Cards & stats */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px}
.stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:500}
.stat-value{font-size:24px;font-weight:700;color:var(--navy);margin-top:6px}
.stat-value.teal{color:var(--teal)}
.stat-value.danger{color:var(--danger)}
.stat-value.warn{color:var(--warn)}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:100%}
thead{background:#F8FAFC}
th{text-align:left;padding:12px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#F8FAFC}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* Forms */
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;min-width:180px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--teal)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--teal)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(11,37,69,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-backdrop.hidden{display:none}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.modal-lg{max-width:820px}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h2{font-size:16px;color:var(--navy)}
.btn-close{background:none;border:none;font-size:22px;color:var(--muted);line-height:1}
.modal-body{padding:22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:8px;color:#fff;font-size:13px;font-weight:500;opacity:0;transform:translateY(10px);transition:all .2s;z-index:300;pointer-events:none;max-width:340px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.info{background:var(--navy)}

/* POS */
.pos-grid{display:grid;grid-template-columns:1fr 400px;gap:20px;align-items:start}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px;max-height:calc(100vh - 320px);overflow-y:auto;padding-right:4px}
.product-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:all .15s;text-align:left}
.product-card:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(13,148,136,.15)}
.product-card .name{font-weight:600;font-size:13px;color:var(--navy);margin-bottom:2px}
.product-card .meta{font-size:11px;color:var(--muted)}
.product-card .price{font-weight:600;color:var(--teal);font-size:13px;margin-top:4px}
.product-card .stock{font-size:11px;color:var(--muted)}
.cart-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.cart-item:last-child{border-bottom:none}
.cart-item .info{flex:1;min-width:0}
.cart-item .info .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item .info .p{font-size:11px;color:var(--muted)}
.cart-item input[type=number]{width:56px;padding:4px;text-align:center;border:1px solid var(--border);border-radius:6px}
.totals{border-top:1px solid var(--border);padding-top:12px;margin-top:12px;font-size:13px}
.totals .row{display:flex;justify-content:space-between;padding:4px 0}
.totals .row.big{font-weight:700;color:var(--navy);font-size:16px;padding-top:8px;border-top:1px dashed var(--border);margin-top:4px}
.payment-line{display:flex;gap:6px;margin-bottom:6px}
.payment-line select{flex:0 0 110px;padding:6px;border:1px solid var(--border);border-radius:6px}
.payment-line input{flex:1;padding:6px;border:1px solid var(--border);border-radius:6px;text-align:right}
.payment-line button{background:none;border:none;color:var(--danger);font-size:16px}

/* Misc */
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500}
.badge-green{background:#D1FAE5;color:#065F46}
.badge-amber{background:#FEF3C7;color:#92400E}
.badge-red{background:#FEE2E2;color:#991B1B}
.badge-blue{background:#DBEAFE;color:#1E40AF}
.badge-gray{background:#E2E8F0;color:#475569}
.section-title{font-size:15px;font-weight:600;color:var(--navy);margin-bottom:12px;margin-top:24px}
.credit-footer{text-align:center;padding:24px;color:var(--muted);font-size:11px}

/* Responsive */
@media(max-width:900px){
  .pos-grid{grid-template-columns:1fr}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:block}
  .quick-actions .btn span{display:none}
  .form-row{grid-template-columns:1fr}
}

/* Print */
@media print{
  .sidebar,.topbar,.quick-actions,.toolbar,.no-print,.demo-banner,.hamburger{display:none!important}
  .main{margin-left:0}
  .content{padding:0}
  .card,.table-wrap{border:none;box-shadow:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brandSlot"></div>
    <nav class="nav" id="navSlot"></nav>
    <div class="credit">Developed by <strong>Zuniq Studio</strong></div>
  </aside>
  <div class="main">
    <div class="demo-banner">Demo Mode — Data is stored locally in your browser. Not a production database.</div>
    <header class="topbar">
      <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <div class="quick-actions">
        <button class="btn btn-primary" onclick="go('pos')">➕ <span>New Sale</span></button>
        <button class="btn btn-navy" onclick="quickAddProduct()">📦 <span>Add Product</span></button>
        <button class="btn btn-outline" onclick="quickAddExpense()">💸 <span>Add Expense</span></button>
        <button class="btn btn-outline" onclick="go('customers')">🔍 <span>Find Customer</span></button>
      </div>
    </header>
    <main class="content" id="content"></main>
    <div class="credit-footer">Optical Store Management System · Developed by Zuniq Studio</div>
  </div>
</div>

<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   UTILITIES
============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,9));
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('en-PK',{year:'numeric',month:'short',day:'numeric'}) : '';
const fmtDateTime = iso => iso ? new Date(iso).toLocaleString('en-PK',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
const parseMoney = s => Math.round((parseFloat(s)||0)*100);
const fmtMoney = p => 'Rs '+(p||0)/100>=0 ? 'Rs '+((p||0)/100).toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2}) : '-Rs '+Math.abs((p||0)/100).toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2});

/* Fix fmtMoney for negatives cleanly */
function money(paisa){
  const v = (paisa||0)/100;
  const neg = v < 0;
  const s = Math.abs(v).toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?'-Rs ':'Rs ')+s;
}

function toast(msg, type='info'){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast '+type+' show';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 3200);
}

function openModal(title, bodyHTML, onSubmit, opts={}){
  const m = $('modal');
  m.className = 'modal'+(opts.large?' modal-lg':'');
  m.innerHTML = `
    <div class="modal-header">
      <h2>${esc(title)}</h2>
      <button class="btn-close" data-close>&times;</button>
    </div>
    <form id="modalForm" autocomplete="off">
      <div class="modal-body">${bodyHTML}</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">${esc(opts.submitLabel||'Save')}</button>
      </div>
    </form>`;
  $('modalBackdrop').classList.remove('hidden');
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick = closeModal);
  $('modalForm').onsubmit = e => {
    e.preventDefault();
    try{
      const result = onSubmit(new FormData(e.target));
      if(result === false) return;
      closeModal();
    }catch(err){
      toast(err.message || 'Error saving', 'error');
    }
  };
  const first = m.querySelector('input,select,textarea');
  if(first) setTimeout(()=>first.focus(),50);
}
function closeModal(){ $('modalBackdrop').classList.add('hidden'); $('modal').innerHTML=''; }

/* ============================================================
   DATA LAYER
============================================================ */
const DB_KEY = 'optical_store_db_v1';
let db = null;
const state = { view:'dashboard', params:{}, pos:{cart:[],customerId:null,walkin:true,payments:[],discount:0,newName:'',newPhone:''} };

function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){ try{ db = JSON.parse(raw); }catch(e){ db=null; } }
  if(!db){ db = seedDB(); saveDB(); }
}
function resetDB(){ localStorage.removeItem(DB_KEY); db=seedDB(); saveDB(); }

function seedDB(){
  const now = new Date().toISOString();
  const products = [
    {id:uuid(),sku:'SUN-001',name:'Ray-Ban Aviator Classic',brand:'Ray-Ban',model:'RB3025',category:'sunglasses',colour:'Gold/Green',size:'58mm',purchaseCost:850000,sellingPrice:1500000,quantity:12,lowStockThreshold:3,supplierId:null,imageUrl:'',isArchived:false,createdAt:now},
    {id:uuid(),sku:'SUN-002',name:'Oakley Holbrook',brand:'Oakley',model:'OO9102',category:'sunglasses',colour:'Matte Black',size:'55mm',purchaseCost:950000,sellingPrice:1800000,quantity:8,lowStockThreshold:3,supplierId:null,imageUrl:'',isArchived:false,createdAt:now},
    {id:uuid(),sku:'FRM-001',name:'Lindberg Air Titanium',brand:'Lindberg',model:'Air',category:'frames',colour:'Silver',size:'48mm',purchaseCost:1200000,sellingPrice:2200000,quantity:6,lowStockThreshold:2,supplierId:null,imageUrl:'',isArchived:false,createdAt:now},
    {id:uuid(),sku:'FRM-002',name:'Persol Round',brand:'Persol',model:'PO3092',category:'frames',colour:'Havana',size:'50mm',purchaseCost:1000000,sellingPrice:1900000,quantity:4,lowStockThreshold:2,supplierId:null,imageUrl:'',isArchived:false,createdAt:now},
    {id:uuid(),sku:'LEN-001',name:'Essilor Crizal Single Vision',brand:'Essilor',model:'Crizal',category:'lenses',colour:'Clear',size:'Standard',purchaseCost:120000,sellingPrice:350000,quantity:40,lowStockThreshold:10,supplierId:null,imageUrl:'',isArchived:false,createdAt:now},
    {id:uuid(),sku:'LEN-002',name:'Zeiss Progressive',brand:'Zeiss',model:'Progressive',category:'lenses',colour:'Clear',size:'Standard',purchaseCost:250000,sellingPrice:650000,quantity:2,lowStockThreshold:5,supplierId:null,imageUrl:'',isArchived:false,createdAt:now},
    {id:uuid(),sku:'ACC-001',name:'Microfiber Cleaning Cloth',brand:'Generic',model:'Standard',category:'accessories',colour:'Blue',size:'One size',purchaseCost:5000,sellingPrice:20000,quantity:100,lowStockThreshold:20,supplierId:null,imageUrl:'',isArchived:false,createdAt:now},
    {id:uuid(),sku:'ACC-002',name:'Hard Shell Case',brand:'Generic',model:'Standard',category:'accessories',colour:'Black',size:'One size',purchaseCost:30000,sellingPrice:80000,quantity:50,lowStockThreshold:10,supplierId:null,imageUrl:'',isArchived:false,createdAt:now}
  ];
  const customers = [
    {id:uuid(),name:'Ahmed Khan',phone:'0300-1234567',address:'Gulberg III, Lahore',notes:'Prefers Ray-Ban',isArchived:false,createdAt:now},
    {id:uuid(),name:'Fatima Ali',phone:'0321-7654321',address:'DHA Phase 5, Lahore',notes:'',isArchived:false,createdAt:now},
    {id:uuid(),name:'Hassan Raza',phone:'0333-1112223',address:'Model Town, Lahore',notes:'',isArchived:false,createdAt:now}
  ];
  const suppliers = [
    {id:uuid(),name:'Optical Supplies Co.',phone:'042-35789012',address:'Hall Road, Lahore',isArchived:false,createdAt:now},
    {id:uuid(),name:'Vision Imports Ltd.',phone:'021-34455667',address:'Saddar, Karachi',isArchived:false,createdAt:now}
  ];
  const staff = [
    {id:uuid(),name:'Sara Ahmed',role:'Cashier',joiningDate:'2024-01-15',baseSalary:3500000,isActive:true,createdAt:now},
    {id:uuid(),name:'Ali Hassan',role:'Sales Associate',joiningDate:'2024-03-01',baseSalary:3000000,isActive:true,createdAt:now}
  ];
  const settings = {
    storeName:'Vision Optics', logoUrl:'', address:'123 Main Boulevard, Gulberg III, Lahore', phone:'042-35551234',
    currency:'PKR', timezone:'Asia/Karachi', invoicePrefix:'INV', invoiceFooter:'Thank you for your business! Please visit again.',
    taxEnabled:false, taxRate:0, prescriptionEnabled:true, invoiceCounter:0,
    categories:['sunglasses','frames','lenses','accessories'],
    paymentMethods:['cash','bank_transfer','card']
  };

  // Seed one credit sale to demonstrate balances
  const p1 = products[0], p2 = products[6];
  const saleId = uuid();
  const sale = {
    id:saleId, invoiceNumber:'INV-00001', customerId:customers[2].id, isWalkin:false,
    items:[
      {productId:p1.id,name:p1.name,sku:p1.sku,quantity:1,unitPrice:p1.sellingPrice,discount:0,costAtSale:p1.purchaseCost,lineTotal:p1.sellingPrice},
      {productId:p2.id,name:p2.name,sku:p2.sku,quantity:2,unitPrice:p2.sellingPrice,discount:0,costAtSale:p2.purchaseCost,lineTotal:p2.sellingPrice*2}
    ],
    subtotal:p1.sellingPrice+p2.sellingPrice*2, discountTotal:0, total:p1.sellingPrice+p2.sellingPrice*2,
    paidTotal:1000000, balanceDue:(p1.sellingPrice+p2.sellingPrice*2)-1000000,
    payments:[{id:uuid(),amount:1000000,method:'cash',paidAt:now}],
    status:'completed', createdAt:now, createdBy:'demo'
  };
  products[0].quantity -= 1;
  products[6].quantity -= 2;
  settings.invoiceCounter = 1;

  return {
    settings, products, customers, suppliers, staff,
    sales:[sale], payments:[], returns:[], expenses:[], purchases:[], purchaseItems:[],
    payroll:[], advances:[], closings:[], movements:[]
  };
}

/* ============================================================
   BUSINESS HELPERS
============================================================ */
function custBalance(customerId){
  return db.sales.filter(s=>s.customerId===customerId && s.status!=='voided').reduce((sum,s)=>sum+s.balanceDue,0);
}
function generateInvoice(){
  db.settings.invoiceCounter = (db.settings.invoiceCounter||0)+1;
  return db.settings.invoicePrefix+'-'+String(db.settings.invoiceCounter).padStart(5,'0');
}
function activeProducts(){ return db.products.filter(p=>!p.isArchived); }
function activeCustomers(){ return db.customers.filter(c=>!c.isArchived); }

/* ============================================================
   NAVIGATION
============================================================ */
const NAV = [
  {id:'dashboard',icon:'📊',label:'Dashboard'},
  {id:'pos',icon:'💳',label:'New Sale'},
  {id:'inventory',icon:'📦',label:'Inventory'},
  {id:'sales',icon:'🧾',label:'Sales'},
  {id:'customers',icon:'👥',label:'Customers'},
  {id:'suppliers',icon:'🚚',label:'Suppliers'},
  {id:'staff',icon:'👔',label:'Staff & Payroll'},
  {id:'expenses',icon:'💸',label:'Expenses'},
  {id:'closing',icon:'🔒',label:'Daily Closing'},
  {id:'reports',icon:'📈',label:'Reports'},
  {id:'settings',icon:'⚙️',label:'Settings'}
];

function renderSidebar(){
  const s = db.settings;
  $('brandSlot').innerHTML = (s.logoUrl
    ? `<img src="${esc(s.logoUrl)}" class="brand-logo" onerror="this.style.display='none'">`
    : `<div class="brand-initials">${esc((s.storeName||'OS').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase())}</div>`)
    + `<div><div class="brand-name">${esc(s.storeName)}</div><div class="brand-sub">Management</div></div>`;
  $('navSlot').innerHTML = NAV.map(n=>`
    <div class="nav-item ${state.view===n.id?'active':''}" onclick="go('${n.id}')">
      <span class="icon">${n.icon}</span><span>${n.label}</span>
    </div>`).join('');
}
function go(view, params={}){
  state.view = view;
  state.params = params;
  if(view==='pos'){ resetPOSIfEmpty(); }
  renderSidebar();
  renderContent();
  $('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}
function renderContent(){
  const content = $('content');
  const titles = {dashboard:'Dashboard',pos:'Point of Sale',inventory:'Inventory',sales:'Sales & Invoices',customers:'Customers',suppliers:'Suppliers & Purchases',staff:'Staff & Payroll',expenses:'Expenses',closing:'Daily Closing',reports:'Reports',settings:'Settings'};
  $('pageTitle').textContent = titles[state.view] || 'Dashboard';
  try{
    const html = ({
      dashboard:renderDashboard, pos:renderPOS, inventory:renderInventory, sales:renderSales,
      customers:renderCustomers, suppliers:renderSuppliers, staff:renderStaff, expenses:renderExpenses,
      closing:renderClosing, reports:renderReports, settings:renderSettings
    })[state.view]();
    content.innerHTML = html;
    // Attach listeners where needed
    if(state.view==='pos') attachPOSListeners();
    if(state.view==='closing') attachClosingListeners();
    if(state.view==='reports') attachReportsListeners();
  }catch(err){
    content.innerHTML = `<div class="card" style="color:#B91C1C"><strong>Error rendering view:</strong> ${esc(err.message)}</div>`;
    console.error(err);
  }
}

   DASHBOARD
============================================================ */
function renderDashboard(){
  const today = todayStr();
  const todaySales = db.sales.filter(s=>s.status!=='voided' && s.createdAt.slice(0,10)===today);
  const todayPayments = db.sales.flatMap(s=>s.payments||[]).filter(p=>p.paidAt.slice(0,10)===today);
  const cashToday = todayPayments.filter(p=>p.method==='cash').reduce((s,p)=>s+p.amount,0);
  const digitalToday = todayPayments.filter(p=>p.method!=='cash').reduce((s,p)=>s+p.amount,0);
  const todayExpenses = db.expenses.filter(e=>e.date===today).reduce((s,e)=>s+e.amount,0);
  const netSalesToday = todaySales.reduce((s,x)=>s+x.total,0) - db.returns.filter(r=>r.createdAt.slice(0,10)===today).reduce((s,r)=>s+r.refundAmount,0);
  const totalDue = db.customers.reduce((s,c)=>s+custBalance(c.id),0);
  const lowStock = activeProducts().filter(p=>p.quantity<=p.lowStockThreshold);

  const monthSales = db.sales.filter(s=>s.status!=='voided' && s.createdAt.slice(0,7)===month).reduce((s,x)=>s+x.total,0);
  const monthExpenses = db.expenses.filter(e=>e.date.slice(0,7)===month).reduce((s,e)=>s+e.amount,0);
  const recent = [...db.sales].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,8);

  return `
    <div class="stats">

      <div class="stat"><div class="stat-label">Payments Collected</div><div class="stat-value">${money(cashToday+digitalToday)}</div><div style="font-size:11px;color:var(--muted);margin-top:4px">Cash ${money(cashToday)} · Digital ${money(digitalToday)}</div></div>
      <div class="stat"><div class="stat-label">Today's Expenses</div><div class="stat-value danger">${money(todayExpenses)}</div></div>
      <div class="stat"><div class="stat-label">Customer Balances Due</div><div class="stat-value warn">${money(totalDue)}</div></div>
      <div class="stat"><div class="stat-label">Low-Stock Products</div><div class="stat-value ${lowStock.length?'danger':''}">${lowStock.length}</div></div>
    </div>

    <div class="stats" style="grid-template-columns:1fr 1fr">
      <div class="stat"><div class="stat-label">This Month's Sales</div><div class="stat-value teal">${money(monthSales)}</div></div>
      <div class="stat"><div class="stat-label">This Month's Expenses</div><div class="stat-value danger">${money(monthExpenses)}</div></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Recent Sales</h2>
        <button class="btn btn-outline btn-sm" onclick="go('sales')">View all</button>
      </div>
      ${recent.length? `<div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Total</th><th>Balance</th><th>Status</th></tr></thead><tbody>
        ${recent.map(s=>`<tr onclick="printInvoice('${s.id}')" style="cursor:pointer">
          <td><strong>${esc(s.invoiceNumber)}</strong></td>
          <td>${s.isWalkin?'Walk-in':esc((db.customers.find(c=>c.id===s.customerId)||{}).name||'—')}</td>
          <td>${fmtDate(s.createdAt)}</td>
          <td>${money(s.total)}</td>
          <td>${s.balanceDue>0?`<span class="badge badge-amber">${money(s.balanceDue)}</span>`:`<span class="badge badge-green">Paid</span>`}</td>
          <td>${s.status==='voided'?'<span class="badge badge-red">Voided</span>':'<span class="badge badge-green">Completed</span>'}</td>
        </tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">No sales yet. Create your first sale from New Sale.</div>`}
    </div>

    ${lowStock.length? `<div class="card" style="margin-top:20px">
      <div class="card-header"><h2 class="card-title">Low Stock Alerts</h2><button class="btn btn-outline btn-sm" onclick="go('inventory')">Inventory</button></div>
      <div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>In Stock</th><th>Threshold</th></tr></thead><tbody>
      ${lowStock.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td><span class="badge badge-red">${p.quantity}</span></td><td>${p.lowStockThreshold}</td></tr>`).join('')}

/* ============================================================
   POS / NEW SALE
============================================================ */
function resetPOSIfEmpty(){
  if(state.pos.cart.length===0 && !state.pos.customerId && !state.pos.walkin){
    state.pos = {cart:[],customerId:null,walkin:true,payments:[{id:uuid(),method:'cash',amount:0}],discount:0,newName:'',newPhone:''};
  }
  if(state.pos.payments.length===0) state.pos.payments = [{id:uuid(),method:'cash',amount:0}];
}

function renderPOS(){
  const cart = state.pos.cart;
  const products = activeProducts();
  const subtotal = cart.reduce((s,i)=>s+i.unitPrice*i.quantity,0);
  const total = subtotal - state.pos.discount;
  const paid = state.pos.payments.reduce((s,p)=>s+(p.amount||0),0);
  const balance = total - paid;
  const customers = activeCustomers();
  const p = state.pos;

  return `
  <div class="pos-grid">
    <div class="card">
      <input id="posSearch" class="toolbar-input" style="width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:10px;font-size:15px" placeholder="Search products by name or SKU…" oninput="renderPOSProducts(this.value)">
      <div class="product-grid" id="posProducts">${renderPOSProductCards('', products)}</div>
    </div>
    <div class="card">
      <h2 class="card-title" style="margin-bottom:12px">Cart</h2>
      <div id="posCart">${renderPOSCart()}</div>

      <div style="margin-top:14px">
        <div class="form-group">
          <label>Customer</label>
          <select id="posCustomerSelect" onchange="posSelectCustomer(this.value)">
            <option value="walkin" ${p.walkin?'selected':''}>Walk-in customer (full payment only)</option>
            <option value="new" ${!p.walkin&&!p.customerId?'selected':''}>+ Add new customer</option>
            ${customers.map(c=>`<option value="${c.id}" ${p.customerId===c.id?'selected':''}>${esc(c.name)} — ${esc(c.phone)}${custBalance(c.id)>0?' (Due: '+money(custBalance(c.id))+')':''}</option>`).join('')}
          </select>
        </div>
        ${!p.walkin && !p.customerId ? `
          <div class="form-row">
            <div class="form-group"><label>New customer name</label><input id="posNewName" value="${esc(p.newName)}" oninput="state.pos.newName=this.value"></div>
            <div class="form-group"><label>Phone</label><input id="posNewPhone" value="${esc(p.newPhone)}" oninput="state.pos.newPhone=this.value"></div>
          </div>` : ''}
      </div>

      <div class="totals" style="margin-top:14px">
        <div class="row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
        <div class="row"><span>Discount</span><input type="number" min="0" style="width:90px;padding:3px 6px;text-align:right;border:1px solid var(--border);border-radius:6px" value="${state.pos.discount/100}" onchange="state.pos.discount=parseMoney(this.value);renderPOSRefresh()"></div>
        <div class="row big"><span>Total</span><span>${money(total)}</span></div>
      </div>

      <div style="margin-top:14px">
        <label style="font-size:12px;color:var(--muted);font-weight:500">Payments (split allowed)</label>
        <div id="posPayments" style="margin-top:6px">${renderPOSPayments()}</div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn btn-outline btn-sm" onclick="posAddPaymentLine()">+ Add line</button>
          <button class="btn btn-outline btn-sm" onclick="posFillBalance()">Fill remaining</button>
        </div>
      </div>

      <div class="totals" style="margin-top:14px">
        <div class="row"><span>Paid</span><span>${money(paid)}</span></div>
        <div class="row big" style="color:${balance>0?'var(--warn)':balance<0?'var(--danger)':'var(--success)'}"><span>Balance</span><span>${money(balance)}</span></div>
      </div>

      <button class="btn btn-primary" style="width:100%;padding:14px;margin-top:14px;font-size:15px" id="posCompleteBtn" onclick="posCompleteSale()">Complete Sale</button>
    </div>
  </div>`;
}

function renderPOSProductCards(search, products){
  const q = search.toLowerCase();
  const list = products.filter(p=>!q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q));
  if(!list.length) return `<div class="empty" style="grid-column:1/-1">No products found.</div>`;
  return list.map(p=>`
    <button class="product-card" onclick="posAddToCart('${p.id}')" ${p.quantity<=0?'disabled style="opacity:.5;cursor:not-allowed"':''}>
      <div class="name">${esc(p.name)}</div>
      <div class="meta">${esc(p.sku)} · ${esc(p.category)}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
        <span class="price">${money(p.sellingPrice)}</span>
        <span class="stock">Stock: ${p.quantity}</span>
      </div>
    </button>`).join('');
}
function renderPOSProducts(search){ $('posProducts').innerHTML = renderPOSProductCards(search, activeProducts()); }

function renderPOSCart(){
  const cart = state.pos.cart;
  if(!cart.length) return `<div class="empty" style="padding:20px">Click a product to add it.</div>`;
  return cart.map((item,i)=>{
    const prod = db.products.find(p=>p.id===item.productId);
    return `<div class="cart-item">
      <div class="info"><div class="n">${esc(item.name)}</div><div class="p">${money(item.unitPrice)} each · Stock: ${prod?prod.quantity:0}</div></div>
      <input type="number" min="1" value="${item.quantity}" onchange="posSetQty(${i},this.value)">
      <div style="min-width:80px;text-align:right;font-weight:600">${money(item.unitPrice*item.quantity)}</div>
      <button onclick="posRemoveItem(${i})" style="background:none;border:none;color:var(--danger);font-size:16px">×</button>
    </div>`;
  }).join('');
}

function renderPOSPayments(){
  return state.pos.payments.map((p,i)=>`
    <div class="payment-line">
      <select onchange="state.pos.payments[${i}].method=this.value">
        <option value="cash" ${p.method==='cash'?'selected':''}>Cash</option>
        <option value="bank_transfer" ${p.method==='bank_transfer'?'selected':''}>Bank transfer</option>
        <option value="card" ${p.method==='card'?'selected':''}>Card</option>
      </select>
      <input type="number" min="0" step="0.01" placeholder="Amount" value="${p.amount?(p.amount/100):''}" onchange="state.pos.payments[${i}].amount=parseMoney(this.value)">
      <button onclick="posRemovePayment(${i})">×</button>
    </div>`).join('');
}

function renderPOSRefresh(){
  const cart = state.pos.cart;
  const subtotal = cart.reduce((s,i)=>s+i.unitPrice*i.quantity,0);
  const total = subtotal - state.pos.discount;
  const paid = state.pos.payments.reduce((s,p)=>s+(p.amount||0),0);
  const balance = total - paid;
  // Re-render whole POS is simplest & safe
  $('content').innerHTML = renderPOS();
  attachPOSListeners();
  const search = $('posSearch');
  if(search && search._v) search.value = search._v;
}
function attachPOSListeners(){
  const search = $('posSearch');
  if(search){ search._v = search.value; search.oninput = e => renderPOSProducts(e.target.value); search.value = ''; search.focus(); }
}

function posAddToCart(id){
  const p = db.products.find(x=>x.id===id);
  if(!p) return;
  const existing = state.pos.cart.find(i=>i.productId===id);
  if(existing){
    if(existing.quantity+1 > p.quantity){ toast(`Only ${p.quantity} in stock`,'error'); return; }
    existing.quantity++;
  }else{
    if(p.quantity<1){ toast('Out of stock','error'); return; }
    state.pos.cart.push({productId:p.id,name:p.name,sku:p.sku,quantity:1,unitPrice:p.sellingPrice,discount:0});
  }
  renderPOSRefresh();
}
function posSetQty(i,q){
  const prod = db.products.find(p=>p.id===state.pos.cart[i].productId);
  q = Math.max(1, parseInt(q)||1);
  if(prod && q > prod.quantity){ toast(`Only ${prod.quantity} in stock`,'error'); q = prod.quantity; }
  state.pos.cart[i].quantity = q;
  renderPOSRefresh();
}
function posRemoveItem(i){ state.pos.cart.splice(i,1); renderPOSRefresh(); }
function posAddPaymentLine(){ state.pos.payments.push({id:uuid(),method:'cash',amount:0}); renderPOSRefresh(); }
function posRemovePayment(i){ if(state.pos.payments.length===1){ state.pos.payments[0].amount=0; } else { state.pos.payments.splice(i,1); } renderPOSRefresh(); }
function posFillBalance(){
  const cart = state.pos.cart;
  const subtotal = cart.reduce((s,i)=>s+i.unitPrice*i.quantity,0);
  const total = subtotal - state.pos.discount;
  const paid = state.pos.payments.reduce((s,p)=>s+(p.amount||0),0);
  const remaining = total - paid;
  if(remaining <= 0) return;
  const empty = state.pos.payments.find(p=>!p.amount);
  if(empty) empty.amount = remaining;
  else state.pos.payments[0].amount = (state.pos.payments[0].amount||0) + remaining;
  renderPOSRefresh();
}
function posSelectCustomer(v){
  if(v==='walkin'){ state.pos.walkin=true; state.pos.customerId=null; }
  else if(v==='new'){ state.pos.walkin=false; state.pos.customerId=null; }
  else { state.pos.walkin=false; state.pos.customerId=v; }
  renderPOSRefresh();
}

function posCompleteSale(){
  const btn = $('posCompleteBtn');
  if(btn && btn.disabled) return;
  const cart = state.pos.cart;
  if(!cart.length) return toast('Cart is empty','error');

  // Stock validation
  for(const item of cart){
    const p = db.products.find(x=>x.id===item.productId);
    if(!p) return toast('Product not found','error');
    if(p.quantity < item.quantity) return toast(`Insufficient stock: ${p.name}`,'error');
  }

  // Create new customer if needed
  let customerId = state.pos.customerId;
  if(!state.pos.walkin && !customerId){
    const name = (state.pos.newName||'').trim();
    const phone = (state.pos.newPhone||'').trim();
    if(!name || !phone) return toast('Enter new customer name and phone','error');
    const c = {id:uuid(),name,phone,address:'',notes:'',isArchived:false,createdAt:new Date().toISOString()};
    db.customers.push(c);
    customerId = c.id;
  }

  const subtotal = cart.reduce((s,i)=>s+i.unitPrice*i.quantity,0);
  const total = subtotal - state.pos.discount;
  const payments = state.pos.payments.filter(p=>p.amount>0).map(p=>({id:uuid(),amount:p.amount,method:p.method,paidAt:new Date().toISOString()}));
  const paid = payments.reduce((s,p)=>s+p.amount,0);
  const balance = total - paid;

  if(balance > 0 && (state.pos.walkin || !customerId)) return toast('Credit sale requires an identified customer','error');
  if(balance < 0) return toast('Payment exceeds total','error');

  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }

  try{
    const saleId = uuid();
    const invoiceNumber = generateInvoice();
    const items = cart.map(i=>{
      const prod = db.products.find(p=>p.id===i.productId);
      return {
        productId:i.productId, name:i.name, sku:i.sku,
        quantity:i.quantity, unitPrice:i.unitPrice, discount:i.discount||0,
        costAtSale:prod.purchaseCost, lineTotal:i.unitPrice*i.quantity-(i.discount||0)
      };
    });

    const sale = {
      id:saleId, invoiceNumber, customerId: state.pos.walkin?null:customerId, isWalkin: state.pos.walkin,
      items, subtotal, discountTotal:state.pos.discount, total, paidTotal:paid, balanceDue:balance,
      payments, status:'completed', createdAt:new Date().toISOString(), createdBy:'demo'
    };

    // Deduct stock & record movements
    for(const item of items){
      const prod = db.products.find(p=>p.id===item.productId);
      prod.quantity -= item.quantity;
      db.movements.push({id:uuid(),productId:prod.id,type:'sale',quantity:-item.quantity,referenceId:saleId,createdAt:sale.createdAt});
    }

    db.sales.push(sale);
    saveDB();

    // Reset POS
    state.pos = {cart:[],customerId:null,walkin:true,payments:[{id:uuid(),method:'cash',amount:0}],discount:0,newName:'',newPhone:''};

    toast(`Sale ${invoiceNumber} saved`,'success');
    renderContent();
    setTimeout(()=>{
      if(confirm(`Sale ${invoiceNumber} saved. Print invoice now?`)) printInvoice(saleId);
    },100);
  }catch(err){
    if(btn){ btn.disabled = false; btn.textContent = 'Complete Sale'; }
    toast(err.message || 'Sale failed','error');
  }
}

function renderInventory(){
  const search = state.params.invSearch || '';
  const cat = state.params.invCat || '';
  let list = activeProducts();
  if(search){
    const q = search.toLowerCase();
    list = list.filter(p=>p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)||(p.brand||'').toLowerCase().includes(q));
  }
  if(cat) list = list.filter(p=>p.category===cat);
  list = [...list].sort((a,b)=>a.name.localeCompare(b.name));

  return `
    <div class="toolbar">
      <input id="invSearch" placeholder="Search by name, SKU, brand…" value="${esc(search)}" oninput="state.params.invSearch=this.value;renderInventoryList()">
      <select id="invCat" onchange="state.params.invCat=this.value;renderInventoryList()">
        <option value="">All categories</option>
        ${db.settings.categories.map(c=>`<option value="${c}" ${cat===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <button class="btn btn-primary" style="margin-left:auto" onclick="quickAddProduct()">+ Add Product</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Stock</th><th>Cost</th><th>Price</th><th>Actions</th></tr></thead>
      <tbody id="invBody">${renderInventoryRows(list)}</tbody>
    </table></div>`;
}
function renderInventoryRows(list){
  if(!list.length) return `<tr><td colspan="7" class="empty">No products found.</td></tr>`;
  return list.map(p=>`<tr>
    <td><strong>${esc(p.sku)}</strong></td>
    <td>${esc(p.name)}<br><span style="font-size:11px;color:var(--muted)">${esc(p.brand||'')} ${esc(p.model||'')} · ${esc(p.colour||'')}</span></td>
    <td><span class="badge badge-blue">${esc(p.category)}</span></td>
    <td>${p.quantity<=p.lowStockThreshold?`<span class="badge badge-red">${p.quantity}</span>`:p.quantity}</td>
    <td>${money(p.purchaseCost)}</td>
    <td>${money(p.sellingPrice)}</td>
    <td>

function adjustStock(id){

  openModal('Manual Stock Adjustment', `
    <p style="margin-bottom:12px;color:var(--muted)">Current stock: <strong>${p.quantity}</strong></p>
    <div class="form-group"><label>New Quantity *</label><input name="quantity" type="number" min="0" required value="${p.quantity}"></div>
    <div class="form-group"><label>Reason * (required)</label><input name="reason" required placeholder="e.g. Damaged, stocktake correction"></div>
  `, fd => {
    const q = parseInt(fd.get('quantity'));
    const reason = fd.get('reason').trim();
    if(isNaN(q) || q<0) throw new Error('Quantity must be 0 or greater');
    if(!reason) throw new Error('Reason is required');

    p.quantity = q;
    db.movements.push({id:uuid(),productId:p.id,type:'adjustment',quantity:diff,reason,createdAt:new Date().toISOString()});
    saveDB(); renderContent(); toast('Stock adjusted','success');
  });
}

function collectPaymentModal(saleId){
  const s = db.sales.find(x=>x.id===saleId);
  if(!s) return;
  openModal('Collect Payment', `
    <p style="margin-bottom:12px">Invoice <strong>${esc(s.invoiceNumber)}</strong> · Balance due: <strong style="color:var(--warn)">${money(s.balanceDue)}</strong></p>
    <div class="form-group"><label>Amount (PKR) *</label><input name="amount" type="number" step="0.01" required max="${s.balanceDue/100}" value="${s.balanceDue/100}"></div>
    <div class="form-group"><label>Method *</label><select name="method" required>
      <option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option><option value="card">Card</option>
    </select></div>
    <div class="form-group"><label>Notes</label><input name="notes"></div>
  `, fd => {
    const amount = parseMoney(fd.get('amount'));
    if(amount<=0) throw new Error('Amount must be positive');
    if(amount > s.balanceDue) throw new Error('Amount exceeds balance');
    const p = {id:uuid(),amount,method:fd.get('method'),paidAt:new Date().toISOString(),notes:fd.get('notes')||''};
    s.payments.push(p);
    s.paidTotal += amount;
    s.balanceDue -= amount;
    saveDB(); renderContent(); toast('Payment recorded','success');
  });
}

function returnModal(saleId){
  const s = db.sales.find(x=>x.id===saleId);
  if(!s) return;
  const priorReturns = db.returns.filter(r=>r.saleId===saleId);
  const available = s.items.map(i=>{
    const returned = priorReturns.filter(r=>r.productId===i.productId).reduce((sum,r)=>sum+r.quantity,0);
    return {...i, available: i.quantity - returned};
  }).filter(i=>i.available>0);
  if(!available.length) return toast('All items already returned','error');
  openModal('Process Return', `
    <div class="form-group"><label>Item *</label><select name="productId" required>
      ${available.map(i=>`<option value="${i.productId}" data-price="${i.unitPrice}" data-cost="${i.costAtSale}">${esc(i.name)} (max ${i.available})</option>`).join('')}
    </select></div>
    <div class="form-row">
      <div class="form-group"><label>Quantity *</label><input name="quantity" type="number" min="1" required value="1"></div>
      <div class="form-group"><label>Refund Method *</label><select name="refundMethod" required>
        <option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option><option value="card">Card</option><option value="credit_note">Credit note</option>
      </select></div>
    </div>
    <div class="form-group"><label>Reason *</label><input name="reason" required placeholder="e.g. Wrong prescription, damaged"></div>
  `, fd => {
    const productId = fd.get('productId');
    const quantity = parseInt(fd.get('quantity'));
    const item = available.find(i=>i.productId===productId);
    if(!item) throw new Error('Item not found');
    if(quantity<1 || quantity>item.available) throw new Error('Invalid quantity');
    const refundAmount = Math.round((item.unitPrice * quantity) - (item.discount * quantity / item.quantity));
    const refundMethod = fd.get('refundMethod');
    const reason = fd.get('reason').trim();
    if(!reason) throw new Error('Reason required');

    const r = {id:uuid(),saleId,productId,quantity,refundMethod,refundAmount,reason,costAtReturn:item.costAtSale,createdAt:new Date().toISOString()};
    db.returns.push(r);

    // Restock
    const prod = db.products.find(x=>x.id===productId);
    if(prod){ prod.quantity += quantity; }
    db.movements.push({id:uuid(),productId,type:'return',quantity:quantity,referenceId:r.id,reason,createdAt:r.createdAt});

    // Adjust sale
    s.total -= refundAmount;
    if(s.balanceDue >= refundAmount){
      s.balanceDue -= refundAmount;
    }else{
      const excess = refundAmount - s.balanceDue;
      s.balanceDue = 0;
      s.paidTotal = Math.max(0, s.paidTotal - excess);
    }
    saveDB(); renderContent(); toast('Return processed','success');
  });
}

      const pid = fd.get('item_product_'+i);
      const qty = parseInt(fd.get('item_qty_'+i));
      const cost = parseMoney(fd.get('item_cost_'+i));
      if(!pid || !qty || qty<1 || cost<0) continue;
      items.push({productId:pid,quantity:qty,unitCost:cost});
      total += qty*cost;
    }
    if(!items.length) throw new Error('Add at least one item');
    if(amountPaid>total) throw new Error('Paid amount exceeds total');

    const purchaseId = uuid();
    const purchase = {
      id:purchaseId, supplierId, billNumber, date, totalAmount:total, amountPaid,
      paymentMethod, notes:fd.get('notes')||'', isVoided:false, createdAt:new Date().toISOString()
    };
    db.purchases.push(purchase);
    for(const item of items){
      const prod = db.products.find(p=>p.id===item.productId);
      prod.quantity += item.quantity;
      prod.purchaseCost = item.unitCost;
      db.movements.push({id:uuid(),productId:prod.id,type:'purchase',quantity:item.quantity,referenceId:purchaseId,createdAt:purchase.createdAt});
    }
    saveDB(); renderContent(); toast('Purchase recorded, stock updated','success');
  }, {large:true});
  window._purchaseProducts = products;
}

function paySalaryModal(payrollId){

  openModal('Pay Salary', `
    <p style="margin-bottom:12px">Net payable: <strong>${money(p.netPayable)}</strong> · Already paid: ${money(p.amountPaid)} · Remaining: <strong style="color:var(--warn)">${money(remaining)}</strong></p>

  `, fd => {
    const amount = parseMoney(fd.get('amount'));
    if(amount<=0 || amount>remaining) throw new Error('Invalid amount');
    const method = fd.get('method');
    const date = fd.get('date');
    p.amountPaid += amount;
    p.status = p.amountPaid >= p.netPayable ? 'paid' : 'partial';
    p.paymentDate = date;
    // Record expense once per payroll
    const existing = db.expenses.find(e=>e.payrollId===payrollId);
    if(existing) existing.amount += amount;
    else db.expenses.push({id:uuid(),date,category:'salary',amount,paymentMethod:method,description:'Salary payment for '+p.salaryMonth,payrollId,createdAt:new Date().toISOString()});
    saveDB(); renderContent(); toast('Salary payment recorded','success');
  });
}

  renderClosingForm();

function renderClosingForm(){
  const date = state.params.closingDate || todayStr();
  const existing = db.closings.find(c=>c.date===date);
  if(existing){
    $('closingForm').innerHTML = `<div class="card" style="border-left:4px solid var(--success)">
      <h3 style="color:var(--navy);margin-bottom:8px">Day already closed</h3>
      <p>Expected: <strong>${money(existing.expectedCash)}</strong> · Counted: <strong>${money(existing.countedCash)}</strong> · Difference: <strong>${money(existing.difference)}</strong></p>
      <p style="color:var(--muted);font-size:12px;margin-top:6px">${esc(existing.notes||'')}</p>
    </div>`;
    return;
  }

  // Compute components
  const paymentsToday = db.sales.flatMap(s=>s.payments||[]).filter(p=>p.paidAt.slice(0,10)===date);
  const cashSales = paymentsToday.filter(p=>p.method==='cash').reduce((s,p)=>s+p.amount,0);
  const digitalSales = paymentsToday.filter(p=>p.method!=='cash').reduce((s,p)=>s+p.amount,0);
  const cashRefunds = db.returns.filter(r=>r.refundMethod==='cash' && r.createdAt.slice(0,10)===date).reduce((s,r)=>s+r.refundAmount,0);
  const cashExpenses = db.expenses.filter(e=>e.paymentMethod==='cash' && e.category!=='salary' && e.date===date).reduce((s,e)=>s+e.amount,0);
  const cashSalary = db.expenses.filter(e=>e.paymentMethod==='cash' && e.category==='salary' && e.date===date).reduce((s,e)=>s+e.amount,0);
  const cashSupplier = db.purchases.filter(p=>(p.paymentMethod||'cash')==='cash' && p.date===date).reduce((s,p)=>s+p.amountPaid,0);

  const prev = [...db.closings].filter(c=>c.date<date).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const openingCash = prev?prev.countedCash:0;
  const additions = 0, withdrawals = 0;
  const expected = openingCash + cashSales - cashRefunds - cashExpenses - cashSalary - cashSupplier + additions - withdrawals;

  $('closingForm').innerHTML = `
    <div class="card">
      <h3 class="card-title" style="margin-bottom:16px">Daily Close — ${fmtDate(date)}</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div>
          <div class="totals">
            <div class="row"><span>Opening Cash</span><span>${money(openingCash)}</span></div>
            <div class="row"><span>+ Cash Payments Received</span><span>${money(cashSales)}</span></div>
            <div class="row"><span>− Cash Refunds</span><span>${money(cashRefunds)}</span></div>
            <div class="row"><span>− Cash Expenses</span><span>${money(cashExpenses)}</span></div>
            <div class="row"><span>− Cash Salary Paid</span><span>${money(cashSalary)}</span></div>
            <div class="row"><span>− Cash Supplier Payments</span><span>${money(cashSupplier)}</span></div>
            <div class="row big"><span>Expected Cash in Drawer</span><span>${money(expected)}</span></div>
          </div>
          <div style="margin-top:16px;color:var(--muted);font-size:12px">Digital payments today (separate): <strong>${money(digitalSales)}</strong></div>
        </div>
        <div>
          <div class="form-group"><label>Counted Cash (PKR) *</label><input id="countedCash" type="number" step="0.01" required oninput="updateDifference(${expected})"></div>
          <div class="form-group"><label>Notes</label><textarea id="closingNotes" rows="3"></textarea></div>
          <div id="diffDisplay" style="margin-bottom:12px;font-weight:600"></div>
          <button class="btn btn-primary" style="width:100%;padding:12px" onclick="saveClosing(${expected})">Close Day</button>
        </div>
      </div>
    </div>`;
}
function updateDifference(expected){
  const counted = parseMoney($('countedCash').value);
  const diff = counted - expected;
  $('diffDisplay').innerHTML = `Difference: <span class="${diff===0?'badge-green':'badge-amber'}">${money(diff)}</span>`;
}
function saveClosing(expected){
  const date = state.params.closingDate || todayStr();
  const counted = parseMoney($('countedCash').value);
  const notes = $('closingNotes').value;
  if(isNaN(counted) || counted<0) return toast('Enter valid counted cash','error');
  const diff = counted - expected;
  db.closings.push({id:uuid(),date,expectedCash:expected,countedCash:counted,difference:diff,notes,closedAt:new Date().toISOString()});
  saveDB(); renderContent(); toast('Day closed','success');
}

function renderReportBody(from, to){
  const sales = db.sales.filter(s=>s.status!=='voided' && s.createdAt.slice(0,10)>=from && s.createdAt.slice(0,10)<=to);
  const returns = db.returns.filter(r=>r.createdAt.slice(0,10)>=from && r.createdAt.slice(0,10)<=to);
  const expenses = db.expenses.filter(e=>e.date>=from && e.date<=to);
  const payments = db.sales.flatMap(s=>s.payments||[]).filter(p=>p.paidAt.slice(0,10)>=from && p.paidAt.slice(0,10)<=to);

  const grossSales = sales.reduce((s,x)=>s+x.total,0);
  const totalReturns = returns.reduce((s,r)=>s+r.refundAmount,0);
  const netSales = grossSales - totalReturns;
  const cogs = sales.reduce((s,x)=>s+x.items.reduce((ss,i)=>ss+i.costAtSale*i.quantity,0),0)
    - returns.reduce((s,r)=>s+(r.costAtReturn||0)*r.quantity,0);
  const grossProfit = netSales - cogs;
  const operatingExpenses = expenses.reduce((s,e)=>s+e.amount,0);
  const operatingProfit = grossProfit - operatingExpenses;
  const cashCollected = payments.filter(p=>p.method==='cash').reduce((s,p)=>s+p.amount,0);
  const digitalCollected = payments.filter(p=>p.method!=='cash').reduce((s,p)=>s+p.amount,0);
  const custBalances = db.customers.reduce((s,c)=>s+custBalance(c.id),0);
  const supplierBalances = db.purchases.reduce((s,p)=>s+Math.max(0,p.totalAmount-p.amountPaid),0);
  const invValue = activeProducts().reduce((s,p)=>s+p.quantity*p.purchaseCost,0);
  const lowStock = activeProducts().filter(p=>p.quantity<=p.lowStockThreshold);

  // Best sellers
  const bsMap = {};
  sales.forEach(s=>s.items.forEach(i=>{
    bsMap[i.productId] = bsMap[i.productId] || {name:i.name, qty:0, revenue:0};
    bsMap[i.productId].qty += i.quantity;
    bsMap[i.productId].revenue += i.lineTotal;
  }));
  const bestSellers = Object.entries(bsMap).sort((a,b)=>b[1].qty-a[1].qty).slice(0,10);

  return `
    <div class="stats">
      <div class="stat"><div class="stat-label">Net Sales</div><div class="stat-value teal">${money(netSales)}</div></div>
      <div class="stat"><div class="stat-label">COGS</div><div class="stat-value">${money(cogs)}</div></div>
      <div class="stat"><div class="stat-label">Gross Profit</div><div class="stat-value teal">${money(grossProfit)}</div></div>
      <div class="stat"><div class="stat-label">Operating Expenses</div><div class="stat-value danger">${money(operatingExpenses)}</div></div>
      <div class="stat"><div class="stat-label">Operating Profit</div><div class="stat-value ${operatingProfit>=0?'teal':'danger'}">${money(operatingProfit)}</div></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Cash Collected</div><div class="stat-value">${money(cashCollected)}</div></div>
      <div class="stat"><div class="stat-label">Digital Collected</div><div class="stat-value">${money(digitalCollected)}</div></div>
      <div class="stat"><div class="stat-label">Customer Balances</div><div class="stat-value warn">${money(custBalances)}</div></div>
      <div class="stat"><div class="stat-label">Supplier Balances</div><div class="stat-value warn">${money(supplierBalances)}</div></div>
      <div class="stat"><div class="stat-label">Inventory Value</div><div class="stat-value">${money(invValue)}</div></div>
    </div>

    <div class="card" style="margin-top:20px">
      <h2 class="card-title">Best-Selling Products</h2>
      ${bestSellers.length?`<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Product</th><th>Qty Sold</th><th>Revenue</th></tr></thead><tbody>
        ${bestSellers.map(([id,d])=>`<tr><td>${esc(d.name)}</td><td>${d.qty}</td><td>${money(d.revenue)}</td></tr>`).join('')}
      </tbody></table></div>`:'<div class="empty">No sales in range.</div>'}
    </div>

    ${lowStock.length?`<div class="card" style="margin-top:20px">
      <h2 class="card-title">Low Stock</h2>
      <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Product</th><th>SKU</th><th>Stock</th></tr></thead><tbody>
        ${lowStock.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td><span class="badge badge-red">${p.quantity}</span></td></tr>`).join('')}
      </tbody></table></div>
    </div>`:''}

    <div class="card" style="margin-top:20px">
      <h2 class="card-title">Expense Breakdown</h2>
      <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Category</th><th>Total</th></tr></thead><tbody>
        ${Object.entries(expenses.reduce((m,e)=>{m[e.category]=(m[e.category]||0)+e.amount;return m},{})).map(([c,v])=>`<tr><td>${esc(c)}</td><td>${money(v)}</td></tr>`).join('') || '<tr><td colspan="2" class="empty">No expenses.</td></tr>'}
      </tbody></table></div>
    </div>
  `;
}
function exportReportsCSV(){
  const from = state.params.repFrom || todayStr().slice(0,7)+'-01';
  const to = state.params.repTo || todayStr();
  const sales = db.sales.filter(s=>s.status!=='voided' && s.createdAt.slice(0,10)>=from && s.createdAt.slice(0,10)<=to);
  const rows = [['Invoice','Date','Customer','Total','Paid','Balance','Status']];
  sales.forEach(s=>{
    const c = s.customerId ? db.customers.find(x=>x.id===s.customerId) : null;
    rows.push([s.invoiceNumber, s.createdAt.slice(0,10), c?c.name:'Walk-in', (s.total/100).toFixed(2), (s.paidTotal/100).toFixed(2), (s.balanceDue/100).toFixed(2), s.status]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sales-report-${from}-to-${to}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

        </div>
        <div class="form-group"><label>Address</label><input name="address" value="${esc(s.address)}"></div>
        <div class="form-group"><label>Logo URL</label><input name="logoUrl" value="${esc(s.logoUrl)}" placeholder="https://…"></div>
        <div class="form-row">
          <div class="form-group"><label>Currency</label><input name="currency" value="${esc(s.currency)}"></div>
          <div class="form-group"><label>Timezone</label><input name="timezone" value="${esc(s.timezone)}"></div>
        </div>

    </div>
  `;
}
function saveSettings(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  Object.assign(db.settings, {
    storeName: fd.get('storeName'),
    phone: fd.get('phone'),
    address: fd.get('address'),
    logoUrl: fd.get('logoUrl'),
    currency: fd.get('currency'),
    timezone: fd.get('timezone'),
    invoicePrefix: fd.get('invoicePrefix') || 'INV',
    taxEnabled: fd.get('taxEnabled') === 'on',
    taxRate: parseFloat(fd.get('taxRate')) || 0,
    invoiceFooter: fd.get('invoiceFooter'),
    prescriptionEnabled: fd.get('prescriptionEnabled') === 'on'
  });
  saveDB(); renderSidebar(); toast('Settings saved','success');
}
